services:

  db:
    image: postgres
    restart: unless-stopped
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: exampleDOT33

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      - 8978:8978
    volumes:
      - cloud-beaver:/opt/cloudbeaver/workspace


  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8977:8080

volumes:
  postgres-data:
  cloud-beaver:
    driver: local