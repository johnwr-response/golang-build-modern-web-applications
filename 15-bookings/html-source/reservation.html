        <script src="https://unpkg.com/notie"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
            let attention = Prompt();

            // Example starter JavaScript for disabling form submissions if there are invalid fields
            (() => {
                'use strict'

                // Fetch all the forms we want to apply custom Bootstrap validation styles to
                const forms = document.querySelectorAll('.needs-validation')

                // Loop over them and prevent submission
                Array.from(forms).forEach(form => {
                    form.addEventListener('submit', event => {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }

                        form.classList.add('was-validated')
                    }, false)
                })
            })()

            document.getElementById('colorButton').addEventListener("click", function(){
                // notify("This is my message", "warning")
                // notifyModal("Title", "<em>Hello World</em>", "success", "My Text for the Button");
                // attention.toast({msg: "Hello, world", icon: "error"});
                // attention.success({msg: "Hello, world"});
                // attention.error({msg: "Oops!"});

                let html = `
                    <form id="check-availability-form" action="" method="post" novalidate="novalidate" class="needs-validation">
                        <div class="row">
                            <div class="col">
                                <div class="row" id="reservation-dates-modal">
                                    <div class="col">
                                        <input type="text" class="form-control" required="required" disabled="disabled" name="start" id="start" placeholder="Arrival">
                                    </div>
                                    <div class="col">
                                        <input type="text" class="form-control" required="required" disabled="disabled" name="end" id="end" placeholder="Departure">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                `
                attention.custom({msg: html, title: "Choose your dates"});
            });

            const elem = document.getElementById('reservation-dates');
            const rangePicker = new DateRangePicker(elem, {
                format: "yyyy-mm-dd"
            });

            function notify(msg, msgType) {
                notie.alert({
                    type: msgType,
                    text: msg,
                })
            }

            function notifyModal(title, text, icon, confirmButtonText) {
                Swal.fire({
                    title: title,
                    html: text,
                    icon: icon,
                    confirmButtonText: confirmButtonText
                })
            }

            function Prompt() {
                let toast = function(c) {
                    const {
                        msg = "",
                        icon = "success",
                        position = "top-end",
                    } = c;

                    const Toast = Swal.mixin({
                        toast: true,
                        title: msg,
                        position: position,
                        icon: icon,
                        iconColor: 'white',
                        customClass: {
                            popup: 'colored-toast',
                        },
                        showConfirmButton: false,
                        timer: 1500,
                        timerProgressBar: true,
                    })
                    ;(async () => {
                        await Toast.fire({})
                    })()

                }
                let success = function(c) {
                    const {
                        msg = "",
                        title = "",
                        footer = "",
                    } = c;
                    Swal.fire({
                        icon: "success",
                        title: title,
                        text: msg,
                        footer: footer,
                    });
                }
                let error = function(c) {
                    const {
                        msg = "",
                        title = "",
                        footer = "",
                    } = c;
                    Swal.fire({
                        icon: "error",
                        title: title,
                        text: msg,
                        footer: footer,
                    });
                }

                async function custom(c) {
                    const {
                        msg = "",
                        title = "",
                    } = c;

                    const {value: formValues} = await Swal.fire({
                        title: title,
                        html: msg,
                        backdrop: false,
                        focusConfirm: false,
                        showCancelButton: true,
                        willOpen: () => {
                            const elem = document.getElementById("reservation-dates-modal");
                            const rp = new DateRangePicker(elem, {
                                format: 'yyyy-mm-dd',
                                showOnFocus: true,
                                orientation: 'top left'
                            })
                        },
                        preConfirm: () => {
                            return [
                                document.getElementById("start").value,
                                document.getElementById("end").value
                            ];
                        },
                        didOpen: () => {
                            document.getElementById("start").removeAttribute('disabled')
                            document.getElementById("end").removeAttribute('disabled')
                        }
                    });
                    if (formValues) {
                        Swal.fire(JSON.stringify(formValues));
                    }

                }

                return {
                    toast: toast,
                    success: success,
                    error: error,
                    custom: custom,
                }
            }

        </script>
